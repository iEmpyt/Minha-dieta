<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dieta de Definição | 2.200 kcal</title>

  <!-- Favicon para navegadores -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2309090b'/><path d='M55 12L22 54h22l-6 34 35-44H50l5-32z' fill='%23f4f4f5' stroke='%2371717a' stroke-width='2'/></svg>" />
  
  <!-- Ícone para Tela de Início do iPhone (iOS) -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png" />

  <!-- Configurações para Web App Nativo iOS -->
  <meta name="apple-mobile-web-app-title" content="Dieta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#09090b" />

  <style>
    :root {
      /* Base Preto & Cinza Escuro Tátil */
      --bg-dark: #09090b;
      --card-bg: #121215;
      --card-border: #27272a;
      --card-inner: #18181b;

      /* Tipografia */
      --text-main: #f4f4f5;
      --text-sub: #71717a;
      --text-muted: #52525b;

      /* Acentos de Cor por Categoria Alimentar */
      --c-cal: #38bdf8;   /* Azul Sky */
      --c-prot: #fb7185;  /* Coral/Rosa Proteína */
      --c-carb: #facc15;  /* Âmbar/Amarelo Carbo */
      --c-fat: #34d399;   /* Menta/Verde Gordura */

      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 40px;
      max-width: 520px;
      margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.01em;
    }

    header {
      margin-top: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 4px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 400;
    }

    /* Grid de Macros */
    .macro-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .macro-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 12px 6px;
      text-align: center;
      position: relative;
    }

    .macro-card::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 0;
      bottom: 10px;
      width: 3px;
      border-radius: 0 4px 4px 0;
    }

    .macro-card.cal::before { background: var(--c-cal); }
    .macro-card.prot::before { background: var(--c-prot); }
    .macro-card.carb::before { background: var(--c-carb); }
    .macro-card.fat::before { background: var(--c-fat); }

    .macro-label {
      font-size: 0.65rem;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 4px;
    }

    .macro-value {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .macro-card.cal .macro-value { color: var(--c-cal); }
    .macro-card.prot .macro-value { color: var(--c-prot); }
    .macro-card.carb .macro-value { color: var(--c-carb); }
    .macro-card.fat .macro-value { color: var(--c-fat); }

    /* Controles Globais */
    .global-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .section-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-sub);
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-action {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-action:active {
      background: var(--card-border);
      color: var(--text-main);
    }

    /* Cards de Refeição */
    .meal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .meal-card.open {
      border-color: #3f3f46;
    }

    .meal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }

    .meal-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .meal-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .meal-badge {
      font-size: 0.7rem;
      color: var(--text-sub);
      background: var(--card-inner);
      border: 1px solid var(--card-border);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    .chevron {
      color: var(--text-muted);
      font-size: 0.75rem;
      transition: transform 0.25s ease;
    }

    .meal-card.open .chevron {
      transform: rotate(180deg);
      color: var(--text-sub);
    }

    .meal-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s cubic-bezier(0, 1, 0, 1);
      padding: 0 16px;
    }

    .meal-card.open .meal-body {
      max-height: 800px;
      transition: max-height 0.3s cubic-bezier(1, 0, 1, 0);
      padding: 0 16px 14px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .food-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .food-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-inner);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .food-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .food-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .food-detail {
      font-size: 0.72rem;
      color: var(--text-sub);
    }

    /* Botão de Substituição Sutil por Categoria */
    .btn-sub {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-sub[data-type="proteins"] { border-color: rgba(251, 113, 133, 0.3); color: var(--c-prot); }
    .btn-sub[data-type="night_proteins"] { border-color: rgba(251, 113, 133, 0.3); color: var(--c-prot); }
    .btn-sub[data-type="carbs"] { border-color: rgba(250, 204, 21, 0.3); color: var(--c-carb); }
    .btn-sub[data-type="fats"] { border-color: rgba(52, 211, 153, 0.3); color: var(--c-fat); }
    .btn-sub[data-type="fruits"] { border-color: rgba(56, 189, 248, 0.3); color: var(--c-cal); }
    .btn-sub[data-type="veggies"] { border-color: rgba(52, 211, 153, 0.3); color: var(--c-fat); }

    .btn-sub:active {
      transform: scale(0.96);
      opacity: 0.8;
    }

    /* Modal Lightbox */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #161619;
      border: 1px solid var(--card-border);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 75vh;
      overflow-y: auto;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .btn-close {
      background: var(--card-inner);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sub-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .sub-item:last-child {
      border-bottom: none;
    }

    .sub-name {
      font-size: 0.85rem;
      color: var(--text-main);
    }

    .sub-qty {
      font-size: 0.78rem;
      color: var(--text-sub);
      background: var(--card-inner);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      font-weight: 500;
    }

    @media (min-width: 520px) {
      .modal-overlay { align-items: center; }
      .modal-content { border-radius: 18px; transform: translateY(16px); }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Dieta de Definição</h1>
      <p>Gabriel Carvalho Santos</p>
    </div>
    <p><strong>2.200</strong> kcal/dia</p>
  </header>

  <section class="macro-grid">
    <div class="macro-card cal">
      <span class="macro-label">Meta</span>
      <span class="macro-value">2200</span>
    </div>
    <div class="macro-card prot">
      <span class="macro-label">Proteína</span>
      <span class="macro-value">180g</span>
    </div>
    <div class="macro-card carb">
      <span class="macro-label">Carbo</span>
      <span class="macro-value">212g</span>
    </div>
    <div class="macro-card fat">
      <span class="macro-label">Gordura</span>
      <span class="macro-value">70g</span>
    </div>
  </section>

  <div class="global-controls">
    <span class="section-tag">Refeições (~150-200g)</span>
    <div class="btn-group">
      <button class="btn-action" onclick="setAllCards(true)">Expandir</button>
      <button class="btn-action" onclick="setAllCards(false)">Recolher</button>
    </div>
  </div>

  <main id="diet-container"></main>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Substituições</h3>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const database = {
      substitutions: {
        carbs: [
          { name: "Arroz cozido", qty: "70g" },
          { name: "Mandioca ou Batata-doce", qty: "60g" },
          { name: "Pão integral", qty: "1 fatia (30g)" },
          { name: "Aveia em flocos", qty: "25g" },
          { name: "Tapioca (goma)", qty: "30g" }
        ],
        proteins: [
          { name: "Peito de Frango (pronto)", qty: "130g" },
          { name: "Patinho / Carne moída magra", qty: "130g" },
          { name: "Ovos inteiros grandes", qty: "3 unidades" },
          { name: "Whey Protein 80%", qty: "35g (1.5 scoop)" },
          { name: "Filé de Tilápia / Merluza", qty: "140g" }
        ],
        fats: [
          { name: "Azeite de Oliva Extra Virgem", qty: "1 col. sopa (10ml)" },
          { name: "Pasta de Amendoim Integral", qty: "25g" },
          { name: "Castanha-do-Pará", qty: "15g (~3 un.)" },
          { name: "Abacate", qty: "50g" }
        ],
        fruits: [
          { name: "Banana média", qty: "1 un. (~80g)" },
          { name: "Morangos frescos", qty: "100g" },
          { name: "Maçã média", qty: "1 un. (~100g)" }
        ],
        veggies: [
          { name: "Brócolis / Cenoura no vapor", qty: "50g" },
          { name: "Folhas verdes (Rúcula/Alface)", qty: "À vontade" }
        ],
        night_proteins: [
          { name: "Queijo Cotage / Ricota leve", qty: "120g" },
          { name: "Iogurte Grego Desnatado", qty: "130g" },
          { name: "Whey Protein 80%", qty: "1 scoop (30g)" }
        ]
      },
      meals: [
        {
          name: "Refeição 1: Pós-Treino",
          time: "08:30 • ~180g",
          isOpen: true,
          items: [
            { name: "Ovos inteiros mexidos", qty: "3 unidades (150g)", type: "proteins" },
            { name: "Pão integral", qty: "1 fatia (30g)", type: "carbs" },
            { name: "Whey Protein 80%", qty: "1 scoop", type: "proteins" }
          ]
        },
        {
          name: "Refeição 2: Almoço Denso",
          time: "12:00 • ~200g",
          isOpen: false,
          items: [
            { name: "Peito de Frango grelhado/desfiado", qty: "130g", type: "proteins" },
            { name: "Arroz cozido", qty: "70g", type: "carbs" },
            { name: "Azeite de Oliva Extra Virgem", qty: "1 col. sopa (10ml)", type: "fats" }
          ]
        },
        {
          name: "Refeição 3: Creme Proteico",
          time: "15:00 • ~160g",
          isOpen: false,
          items: [
            { name: "Iogurte Grego Desnatado", qty: "130g", type: "night_proteins" },
            { name: "Whey Protein 80%", qty: "1 scoop (30g)", type: "proteins" }
          ]
        },
        {
          name: "Refeição 4: Lanche Denso",
          time: "18:00 • ~120g",
          isOpen: false,
          items: [
            { name: "Banana média", qty: "1 unidade (80g)", type: "fruits" },
            { name: "Pasta de Amendoim Integral", qty: "30g", type: "fats" },
            { name: "Castanha-do-Pará", qty: "10g", type: "fats" }
          ]
        },
        {
          name: "Refeição 5: Jantar Denso",
          time: "20:30 • ~190g",
          isOpen: false,
          items: [
            { name: "Patinho moído / Mignon Suíno", qty: "130g", type: "proteins" },
            { name: "Mandioca ou Batata-doce", qty: "60g", type: "carbs" },
            { name: "Azeite de Oliva Extra Virgem", qty: "1 col. sopa (10ml)", type: "fats" }
          ]
        },
        {
          name: "Refeição 6: Ceia Leve",
          time: "22:30 • ~150g",
          isOpen: false,
          items: [
            { name: "Queijo Cotage ou Ricota leve", qty: "120g", type: "night_proteins" },
            { name: "Morangos ou Geleia zero", qty: "50g", type: "fruits" }
          ]
        }
      ]
    };

    function renderDiet() {
      const container = document.getElementById("diet-container");
      container.innerHTML = database.meals.map((meal, index) => `
        <div class="meal-card ${meal.isOpen ? 'open' : ''}" id="card-${index}">
          <div class="meal-header" onclick="toggleCard(${index})">
            <div class="meal-info">
              <span class="chevron">▼</span>
              <h2 class="meal-title">${meal.name}</h2>
            </div>
            <span class="meal-badge">${meal.time}</span>
          </div>
          <div class="meal-body">
            <ul class="food-list">
              ${meal.items.map(item => `
                <li class="food-item">
                  <div class="food-info">
                    <span class="food-name">${item.name}</span>
                    <span class="food-detail">${item.qty}</span>
                  </div>
                  <button class="btn-sub" data-type="${item.type}" onclick="openModal('${item.type}')">Trocar</button>
                </li>
              `).join('')}
            </ul>
          </div>
        </div>
      `).join('');
    }

    function toggleCard(index) {
      database.meals[index].isOpen = !database.meals[index].isOpen;
      renderDiet();
    }

    function setAllCards(openState) {
      database.meals.forEach(m => m.isOpen = openState);
      renderDiet();
    }

    function openModal(type) {
      const modal = document.getElementById("modal");
      const title = document.getElementById("modal-title");
      const body = document.getElementById("modal-body");

      const categoryTitles = {
        proteins: "Substitutos de Proteína",
        night_proteins: "Substitutos de Proteína Leve",
        carbs: "Substitutos de Carboidrato",
        fats: "Substitutos de Gorduras",
        fruits: "Substitutos de Frutas",
        veggies: "Substitutos de Legumes"
      };

      title.innerText = categoryTitles[type] || "Opções de Substituição";

      const subs = database.substitutions[type] || [];
      body.innerHTML = subs.map(sub => `
        <div class="sub-item">
          <span class="sub-name">${sub.name}</span>
          <span class="sub-qty">${sub.qty}</span>
        </div>
      `).join('');

      modal.classList.add("active");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
    }

    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target.id === "modal") closeModal();
    });

    renderDiet();
  </script>
</body>
</html>
