<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Ícone para Tela de Início do iPhone (iOS) -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png" />

  <!-- Configurações Web App iOS -->
  <meta name="apple-mobile-web-app-title" content="Dieta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#09090b" />

  <style>
    :root {
      --bg-dark: #09090b;
      --card-bg: #121215;
      --card-border: #27272a;
      --card-inner: #18181b;

      --text-main: #f4f4f5;
      --text-sub: #71717a;
      --text-muted: #52525b;

      --c-cal: #38bdf8;
      --c-prot: #fb7185;
      --c-carb: #facc15;
      --c-fat: #34d399;

      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 40px;
      max-width: 520px;
      margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.01em;
    }

    header {
      margin-top: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 4px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 400;
    }

    .macro-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .macro-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 12px 6px;
      text-align: center;
      position: relative;
    }

    .macro-card::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 0;
      bottom: 10px;
      width: 3px;
      border-radius: 0 4px 4px 0;
    }

    .macro-card.cal::before { background: var(--c-cal); }
    .macro-card.prot::before { background: var(--c-prot); }
    .macro-card.carb::before { background: var(--c-carb); }
    .macro-card.fat::before { background: var(--c-fat); }

    .macro-label {
      font-size: 0.65rem;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 4px;
    }

    .macro-value {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .macro-card.cal .macro-value { color: var(--c-cal); }
    .macro-card.prot .macro-value { color: var(--c-prot); }
    .macro-card.carb .macro-value { color: var(--c-carb); }
    .macro-card.fat .macro-value { color: var(--c-fat); }

    .global-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .section-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-sub);
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-action {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-action:active {
      background: var(--card-border);
      color: var(--text-main);
    }

    .btn-config {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--c-cal);
    }

    /* Cards de Refeição */
    .meal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .meal-card.open {
      border-color: #3f3f46;
    }

    .meal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }

    .meal-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .meal-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .meal-badge {
      font-size: 0.7rem;
      color: var(--text-sub);
      background: var(--card-inner);
      border: 1px solid var(--card-border);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    .chevron {
      color: var(--text-muted);
      font-size: 0.75rem;
      transition: transform 0.25s ease;
    }

    .meal-card.open .chevron {
      transform: rotate(180deg);
      color: var(--text-sub);
    }

    .meal-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s cubic-bezier(0, 1, 0, 1);
      padding: 0 16px;
    }

    .meal-card.open .meal-body {
      max-height: 800px;
      transition: max-height 0.3s cubic-bezier(1, 0, 1, 0);
      padding: 0 16px 14px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .food-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .food-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-inner);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .food-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .food-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .food-detail {
      font-size: 0.72rem;
      color: var(--text-sub);
    }

    .btn-sub {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-sub[data-type="proteins"], .btn-sub[data-type="night_proteins"] { border-color: rgba(251, 113, 133, 0.3); color: var(--c-prot); }
    .btn-sub[data-type="carbs"] { border-color: rgba(250, 204, 21, 0.3); color: var(--c-carb); }
    .btn-sub[data-type="fats"] { border-color: rgba(52, 211, 153, 0.3); color: var(--c-fat); }
    .btn-sub[data-type="fruits"] { border-color: rgba(56, 189, 248, 0.3); color: var(--c-cal); }
    .btn-sub[data-type="veggies"] { border-color: rgba(52, 211, 153, 0.3); color: var(--c-fat); }

    .btn-sub:active {
      transform: scale(0.96);
      opacity: 0.8;
    }

    /* Modais */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #161619;
      border: 1px solid var(--card-border);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .btn-close {
      background: var(--card-inner);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sub-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.15s ease;
    }

    .sub-item:active {
      background: var(--card-border);
    }

    .sub-name {
      font-size: 0.85rem;
      color: var(--text-main);
    }

    .sub-qty {
      font-size: 0.78rem;
      color: var(--text-sub);
      background: var(--card-inner);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      font-weight: 500;
    }

    /* Formulario GitHub */
    .config-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .config-form label {
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    .config-form input {
      background: var(--card-inner);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .btn-save-config {
      background: var(--c-cal);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .status-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 200;
    }

    .status-toast.active {
      opacity: 1;
    }

    @media (min-width: 520px) {
      .modal-overlay { align-items: center; }
      .modal-content { border-radius: 18px; transform: translateY(16px); }
    }
  </style>
</head>

  <main id="diet-container"></main>

  <!-- Modal de Substituição -->

      <div id="modal-body"></div>
    </div>
  </div>

      <div class="config-form">
        <label>Usuário do GitHub:</label>
        <input type="text" id="gh-user" placeholder="ex: iempyt" />
        
        <label>Nome do Repositório:</label>
        <input type="text" id="gh-repo" placeholder="ex: dieta" />
        
        <label>Personal Access Token (PAT):</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" />
        
        <button class="btn-save-config" onclick="saveGitHubConfig()">Salvar e Conectar</button>
      </div>
    </div>
  </div>

    function renderDiet() {
      const container = document.getElementById("diet-container");
      container.innerHTML = database.meals.map((meal, mIdx) => `
        <div class="meal-card ${meal.isOpen ? 'open' : ''}" id="card-${mIdx}">
          <div class="meal-header" onclick="toggleCard(${mIdx})">
            <div class="meal-info">
              <span class="chevron">▼</span>
              <h2 class="meal-title">${meal.name}</h2>
            </div>
            <span class="meal-badge">${meal.time}</span>
          </div>
          <div class="meal-body">
            <ul class="food-list">
              ${meal.items.map((item, iIdx) => `
                <li class="food-item">
                  <div class="food-info">
                    <span class="food-name">${item.name}</span>
                    <span class="food-detail">${item.qty}</span>
                  </div>
                  <button class="btn-sub" data-type="${item.type}" onclick="openModal('${item.type}', ${mIdx}, ${iIdx})">Trocar</button>
                </li>
              `).join('')}
            </ul>
          </div>
        </div>
      `).join('');
    }

    function toggleCard(index) {
      database.meals[index].isOpen = !database.meals[index].isOpen;
      renderDiet();
    }

    function setAllCards(openState) {
      database.meals.forEach(m => m.isOpen = openState);
      renderDiet();
    }

    function openModal(type, mIdx, iIdx) {
      activeMealIndex = mIdx;
      activeItemIndex = iIdx;

      const modal = document.getElementById("modal");
      const title = document.getElementById("modal-title");
      const body = document.getElementById("modal-body");

      const categoryTitles = {
        proteins: "Substitutos de Proteína (40 opções)",
        night_proteins: "Proteínas Leves para Ceia (40 opções)",
        carbs: "Substitutos de Carboidrato (40 opções)",
        fats: "Substitutos de Gorduras (40 opções)",
        fruits: "Substitutos de Frutas (40 opções)",
        veggies: "Legumes e Verduras (40 opções)"
      };

      title.innerText = categoryTitles[type] || "Opções de Substituição";

      const subs = database.substitutions[type] || [];
      body.innerHTML = subs.map(sub => `
        <div class="sub-item" onclick="selectSubstitution('${sub.name.replace(/'/g, "\\'")}', '${sub.qty}')">
          <span class="sub-name">${sub.name}</span>
          <span class="sub-qty">${sub.qty}</span>
        </div>
      `).join('');

      modal.classList.add("active");
    }

    function selectSubstitution(newName, newQty) {
      if (activeMealIndex !== null && activeItemIndex !== null) {
        database.meals[activeMealIndex].items[activeItemIndex].name = newName;
        database.meals[activeMealIndex].items[activeItemIndex].qty = newQty;
        renderDiet();
        closeModal();
        syncWithGitHub();
      }
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
    }

    /* Integração com GitHub API */
    function openConfigModal() {
      document.getElementById("gh-user").value = localStorage.getItem("gh_user") || "";
      document.getElementById("gh-repo").value = localStorage.getItem("gh_repo") || "";
      document.getElementById("gh-token").value = localStorage.getItem("gh_token") || "";
      document.getElementById("config-modal").classList.add("active");
    }

    function closeConfigModal() {
      document.getElementById("config-modal").classList.remove("active");
    }

    function saveGitHubConfig() {
      localStorage.setItem("gh_user", document.getElementById("gh-user").value.trim());
      localStorage.setItem("gh_repo", document.getElementById("gh-repo").value.trim());
      localStorage.setItem("gh_token", document.getElementById("gh-token").value.trim());
      closeConfigModal();
      showToast("Credenciais do GitHub salvas!");
    }

    async function syncWithGitHub() {
      const user = localStorage.getItem("gh_user");
      const repo = localStorage.getItem("gh_repo");
      const token = localStorage.getItem("gh_token");

      if (!user || !repo || !token) {
        showToast("Alimento alterado localmente! (Configure o GitHub para sincronizar)");
        return;
      }

      showToast("Sincronizando com o GitHub...");

      try {
        const url = `https://api.github.com/repos/${user}/${repo}/contents/index.html`;
        
        // 1. Obter SHA do arquivo atual
        const getRes = await fetch(url, {
          headers: { Authorization: `token ${token}` }
        });
        const getData = await getRes.json();
        const sha = getData.sha;

        // 2. Gerar novo HTML com a variável database atualizada
        let currentHTML = document.documentElement.outerHTML;

        // 3. Commit no GitHub
        const putRes = await fetch(url, {
          method: "PUT",
          headers: {
            Authorization: `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Atualização de dieta via App",
            content: btoa(unescape(encodeURIComponent(currentHTML))),
            sha: sha
          })
        });

        if (putRes.ok) {
          showToast("⚡ Alteração salva direto no GitHub!");
        } else {
          showToast("Erro ao sincronizar com o GitHub.");
        }
      } catch (e) {
        showToast("Erro de rede ao salvar no GitHub.");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.add("active");
      setTimeout(() => toast.classList.remove("active"), 3000);
    }

    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target.id === "modal") closeModal();
    });

    document.getElementById("config-modal").addEventListener("click", (e) => {
      if (e.target.id === "config-modal") closeConfigModal();
    });

    renderDiet();
  </script>
