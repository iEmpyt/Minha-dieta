<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dieta de Definição | 2.200 kcal</title>

  <!-- Favicon SVG Embutido -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2309090b'/><path d='M55 12L22 54h22l-6 34 35-44H50l5-32z' fill='%2338bdf8' stroke='%230284c7' stroke-width='3' stroke-linejoin='round'/></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2309090b'/><path d='M55 12L22 54h22l-6 34 35-44H50l5-32z' fill='%2338bdf8' stroke='%230284c7' stroke-width='3' stroke-linejoin='round'/></svg>" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#09090b" />

  <style>
    :root {
      /* Fundo Preto Intacto */
      --bg-dark: #09090b;
      
      /* Cards e Estruturas */
      --card-bg: #141417;
      --card-border: #27272a;
      
      /* Textos */
      --text-main: #f4f4f5;
      --text-sub: #a1a1aa;
      
      /* Cores Vibrantes nos Elementos */
      --color-cal: #38bdf8;     /* Azul Sky */
      --color-prot: #f43f5e;    /* Rosa/Vermelho Proteína */
      --color-carb: #eab308;    /* Amarelo Carbo */
      --color-fat: #10b981;     /* Verde Gordura */
      
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 40px;
      max-width: 600px;
      margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 12px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    header h1 svg {
      width: 24px;
      height: 24px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* Cards de Macros Coloridos */
    .macro-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .macro-item {
      background: #121215;
      border-radius: 14px;
      padding: 10px 4px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .macro-item::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .macro-item.cal::before { background: var(--color-cal); }
    .macro-item.prot::before { background: var(--color-prot); }
    .macro-item.carb::before { background: var(--color-carb); }
    .macro-item.fat::before { background: var(--color-fat); }

    .macro-item span {
      display: block;
      font-size: 0.65rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .macro-item strong {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 2px;
      display: block;
    }

    .macro-item.cal strong { color: var(--color-cal); }
    .macro-item.prot strong { color: var(--color-prot); }
    .macro-item.carb strong { color: var(--color-carb); }
    .macro-item.fat strong { color: var(--color-fat); }

    .global-controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn-global {
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-global:active {
      background: #27272a;
      transform: scale(0.96);
    }

    /* Cards de Refeição */
    .meal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .meal-card.open {
      border-color: #38bdf8;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.08);
    }

    .meal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      cursor: pointer;
      user-select: none;
    }

    .meal-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .meal-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .meal-time {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .chevron {
      color: var(--text-sub);
      font-size: 0.85rem;
      transition: transform 0.3s ease;
    }

    .meal-card.open .chevron {
      transform: rotate(180deg);
      color: #38bdf8;
    }

    .meal-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0, 1, 0, 1);
      padding: 0 16px;
    }

    .meal-card.open .meal-body {
      max-height: 1000px;
      transition: max-height 0.3s cubic-bezier(1, 0, 1, 0);
      padding: 0 16px 16px 16px;
      border-top: 1px solid var(--card-border);
    }

    .food-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .food-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #09090b;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #27272a;
    }

    .food-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .food-name {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .food-detail {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    /* Botão de Substituir Colorido */
    .btn-sub {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10b981;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      min-height: 36px;
      transition: all 0.15s ease;
    }

    .btn-sub:active {
      background: #10b981;
      color: #000;
      transform: scale(0.95);
    }

    /* Modal / Lightbox */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #141417;
      border: 1px solid #3f3f46;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      width: 100%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .btn-close {
      background: #27272a;
      border: none;
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    .sub-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px;
      border-bottom: 1px solid #27272a;
    }

    .sub-item:last-child {
      border-bottom: none;
    }

    .sub-name {
      font-size: 0.88rem;
      color: var(--text-main);
    }

    .sub-qty {
      font-size: 0.82rem;
      color: #38bdf8;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    @media (min-width: 600px) {
      .modal-overlay { align-items: center; }
      .modal-content { border-radius: 20px; transform: translateY(20px); }
    }
  </style>
</head>
<body>

  <header>
    <h1>
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M55 12L22 54h22l-6 34 35-44H50l5-32z" fill="#38bdf8" stroke="#0284c7" stroke-width="3" stroke-linejoin="round"/>
      </svg>
      Dieta de Definição
    </h1>
    <p>Gabriel Carvalho Santos • 2.200 kcal/dia</p>
  </header>

  <section class="macro-bar">
    <div class="macro-item cal"><span>Calorias</span><strong>2200</strong></div>
    <div class="macro-item prot"><span>Proteína</span><strong>180g</strong></div>
    <div class="macro-item carb"><span>Carbo</span><strong>212g</strong></div>
    <div class="macro-item fat"><span>Gordura</span><strong>70g</strong></div>
  </section>

  <div class="global-controls">
    <button class="btn-global" onclick="setAllCards(true)">Expandir Todas</button>
    <button class="btn-global" onclick="setAllCards(false)">Recolher Todas</button>
  </div>

  <main id="diet-container"></main>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Substituições</h3>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const database = {
      substitutions: {
        carbs: [
          { name: "Arroz (branco ou integral cozido)", qty: "90g" },
          { name: "Batata-doce ou Mandioca cozida", qty: "100g" },
          { name: "Batata inglesa cozida", qty: "140g" },
          { name: "Aveia em flocos", qty: "35g" },
          { name: "Pão de fôrma integral", qty: "2 fatias (~50g)" }
        ],
        proteins: [
          { name: "Peito de frango grelhado", qty: "100g" },
          { name: "Patinho / Alcatra moída (magra)", qty: "110g" },
          { name: "Filé de Tilápia ou Merluza", qty: "140g" },
          { name: "Ovos inteiros grandes", qty: "4 unidades" },
          { name: "Whey Protein (80%)", qty: "38g (~1.5 scoop)" }
        ],
        fats: [
          { name: "Azeite de Oliva Extra Virgem", qty: "1 col. sopa (10ml)" },
          { name: "Abacate em cubos", qty: "70g" },
          { name: "Pasta de Amendoim Integral", qty: "20g (1 col. rasa)" },
          { name: "Castanha-do-Pará", qty: "15g (~3 unidades)" },
          { name: "Manteiga", qty: "12g (1 col. sobremesa)" }
        ],
        fruits: [
          { name: "Banana (prata ou caturra)", qty: "1 un. média (~70g)" },
          { name: "Mamão Papaia", qty: "1/2 unidade (~140g)" },
          { name: "Maçã (com casca)", qty: "1 un. média (~120g)" },
          { name: "Morangos frescos", qty: "200g (~12-15 un.)" },
          { name: "Melão ou Melancia em cubos", qty: "200g" }
        ],
        veggies: [
          { name: "Brócolis (cozido/no vapor)", qty: "100g" },
          { name: "Cenoura (cozida ou ralada)", qty: "100g" },
          { name: "Abobrinha verde (grelhada)", qty: "120g" },
          { name: "Chuchu ou Vagem (refogados)", qty: "120g" },
          { name: "Abóbora cabotiá (assada)", qty: "100g" }
        ],
        night_proteins: [
          { name: "Iogurte Grego Desnatado", qty: "170g" },
          { name: "Queijo Cotage / Ricota Leve", qty: "120g" },
          { name: "Whey Protein 80%", qty: "1 scoop (30g)" },
          { name: "Claras de Ovos (mexidas)", qty: "4 unidades" }
        ]
      },
      meals: [
        {
          name: "Refeição 1: Pós-Treino Imediato",
          time: "08:30",
          isOpen: true,
          items: [
            { name: "Ovos inteiros grandes", qty: "3 unidades", type: "proteins" },
            { name: "Whey Protein 80%", qty: "1 scoop (30g)", type: "proteins" },
            { name: "Aveia em flocos", qty: "50g", type: "carbs" },
            { name: "Banana média", qty: "1 unidade", type: "fruits" }
          ]
        },
        {
          name: "Refeição 2: Almoço",
          time: "12:00",
          isOpen: false,
          items: [
            { name: "Peito de Frango grelhado", qty: "190g (pronto)", type: "proteins" },
            { name: "Arroz cozido", qty: "150g", type: "carbs" },
            { name: "Feijão cozido", qty: "100g", type: "carbs" },
            { name: "Azeite de Oliva Extra Virgem", qty: "1 col. sopa (10ml)", type: "fats" },
            { name: "Brócolis / Legumes", qty: "100g", type: "veggies" }
          ]
        },
        {
          name: "Refeição 3: Lanche da Tarde",
          time: "16:00",
          isOpen: false,
          items: [
            { name: "Iogurte Grego Desnatado", qty: "200g", type: "proteins" },
            { name: "Pão de fôrma integral", qty: "2 fatias", type: "carbs" },
            { name: "Mamão Papaia", qty: "100g", type: "fruits" },
            { name: "Pasta de Amendoim", qty: "15g", type: "fats" }
          ]
        },
        {
          name: "Refeição 4: Jantar",
          time: "20:00",
          isOpen: false,
          items: [
            { name: "Patinho / Mignon Suíno", qty: "180g", type: "proteins" },
            { name: "Batata-doce / Mandioca", qty: "200g", type: "carbs" },
            { name: "Azeite de Oliva Extra Virgem", qty: "1 col. sopa (10ml)", type: "fats" },
            { name: "Salada verde / Rúcula", qty: "À vontade", type: "veggies" }
          ]
        },
        {
          name: "Refeição 5: Ceia (Leve / Sem Carne)",
          time: "22:30",
          isOpen: false,
          items: [
            { name: "Iogurte Grego ou Cotage", qty: "170g ou 120g", type: "night_proteins" },
            { name: "Castanha-do-Pará / Abacate", qty: "15g ou 40g", type: "fats" },
            { name: "Morangos frescos", qty: "100g", type: "fruits" }
          ]
        }
      ]
    };

    function renderDiet() {
      const container = document.getElementById("diet-container");
      container.innerHTML = database.meals.map((meal, index) => `
        <div class="meal-card ${meal.isOpen ? 'open' : ''}" id="card-${index}">
          <div class="meal-header" onclick="toggleCard(${index})">
            <div class="meal-header-left">
              <span class="chevron">▲</span>
              <h2 class="meal-title">${meal.name}</h2>
            </div>
            <span class="meal-time">${meal.time}</span>
          </div>
          <div class="meal-body">
            <ul class="food-list">
              ${meal.items.map(item => `
                <li class="food-item">
                  <div class="food-info">
                    <span class="food-name">${item.name}</span>
                    <span class="food-detail">${item.qty}</span>
                  </div>
                  <button class="btn-sub" onclick="openModal('${item.type}')">Substituir</button>
                </li>
              `).join('')}
            </ul>
          </div>
        </div>
      `).join('');
    }

    function toggleCard(index) {
      database.meals[index].isOpen = !database.meals[index].isOpen;
      renderDiet();
    }

    function setAllCards(openState) {
      database.meals.forEach(m => m.isOpen = openState);
      renderDiet();
    }

    function openModal(type) {
      const modal = document.getElementById("modal");
      const title = document.getElementById("modal-title");
      const body = document.getElementById("modal-body");

      const categoryTitles = {
        proteins: "Substitutos de Proteína (Carnes/Ovos)",
        night_proteins: "Substitutos de Proteína Leve (Ceia)",
        carbs: "Substitutos de Carboidrato",
        fats: "Substitutos de Gorduras",
        fruits: "Substitutos de Frutas",
        veggies: "Substitutos de Legumes"
      };

      title.innerText = categoryTitles[type] || "Opções de Substituição";

      const subs = database.substitutions[type] || [];
      body.innerHTML = subs.map(sub => `
        <div class="sub-item">
          <span class="sub-name">${sub.name}</span>
          <span class="sub-qty">${sub.qty}</span>
        </div>
      `).join('');

      modal.classList.add("active");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
    }

    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target.id === "modal") closeModal();
    });

    renderDiet();
  </script>
</body>
</html>
